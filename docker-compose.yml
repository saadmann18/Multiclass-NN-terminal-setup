version: "3.9"

services:
  # Development service with full project mounted
  dev:
    build:
      context: .
      target: development
    image: mnist-cnn:dev
    environment:
      - DEVICE=${DEVICE:-cpu}
      - EPOCHS=${EPOCHS:-10}
      - MPLBACKEND=Agg
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./experiments:/app/experiments
      - ${HOME}/.torch/datasets:/app/.torch/datasets
    working_dir: /app
    command: ["python", "-m", "mnist_cnn.cli", "train", "--epochs", "${EPOCHS:-10}", "--device", "${DEVICE:-cpu}"]

  # Production training service
  train:
    build:
      context: .
      target: production
    image: mnist-cnn:prod
    environment:
      - DEVICE=${DEVICE:-cpu}
      - EPOCHS=${EPOCHS:-10}
      - MPLBACKEND=Agg
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ${HOME}/.torch/datasets:/app/.torch/datasets
    command: ["mnist-train", "--epochs", "${EPOCHS:-10}", "--device", "${DEVICE:-cpu}"]

  # Production evaluation service
  eval:
    build:
      context: .
      target: production
    image: mnist-cnn:prod
    environment:
      - DEVICE=${DEVICE:-cpu}
      - MPLBACKEND=Agg
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ${HOME}/.torch/datasets:/app/.torch/datasets
    command: ["mnist-eval", "--device", "${DEVICE:-cpu}"]

  # Complete pipeline: train then evaluate
  pipeline:
    build:
      context: .
      target: production
    image: mnist-cnn:prod
    environment:
      - DEVICE=${DEVICE:-cpu}
      - EPOCHS=${EPOCHS:-10}
      - MPLBACKEND=Agg
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ${HOME}/.torch/datasets:/app/.torch/datasets
    entrypoint: ["sh", "-c"]
    command: |
      "mnist-train --epochs ${EPOCHS:-10} --device ${DEVICE:-cpu} && 
       mnist-eval --device ${DEVICE:-cpu}"

  # Jupyter notebook service for development
  notebook:
    build:
      context: .
      target: development
    image: mnist-cnn:dev
    environment:
      - DEVICE=${DEVICE:-cpu}
      - MPLBACKEND=inline
    volumes:
      - ./:/app
      - ${HOME}/.torch/datasets:/app/.torch/datasets
    ports:
      - "8888:8888"
    command: |
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser 
      --allow-root --NotebookApp.token='' --NotebookApp.password=''

  # Testing service
  test:
    build:
      context: .
      target: development
    image: mnist-cnn:dev
    volumes:
      - ./:/app
    command: ["pytest", "tests/", "-v", "--cov=src/mnist_cnn"]
